name: Build DwarfStar CUDA image

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA version"
        required: true
        default: "12.9.1"
        type: choice
        options:
          - "12.9.1"
          - "13.1.2"

      cuda_arch:
        description: "CUDA architecture"
        required: true
        default: "sm_86"
        type: string

      image_tag:
        description: "Image tag"
        required: true
        default: "cuda"
        type: string

  push:
    branches:
      - main
    paths:
      - "Dockerfile.cuda"
      - "Makefile"
      - "*.c"
      - "*.h"
      - "*.cu"
      - "cuda/**"
      - ".github/workflows/build-ds4-cuda.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set metadata
        id: meta
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY##*/}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CUDA_VERSION="${{ inputs.cuda_version }}"
            CUDA_ARCH="${{ inputs.cuda_arch }}"
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            CUDA_VERSION="12.9.1"
            CUDA_ARCH="sm_86"
            IMAGE_TAG="cuda"
          fi

          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "cuda_version=${CUDA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "cuda_arch=${CUDA_ARCH}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cuda
          push: true
          platforms: linux/amd64

          build-args: |
            CUDA_VERSION=${{ steps.meta.outputs.cuda_version }}
            CUDA_ARCH=${{ steps.meta.outputs.cuda_arch }}
            DS4_GIT_COMMIT=${{ github.sha }}
            DS4_BUILD_DATE=${{ steps.meta.outputs.build_date }}

          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.image_tag }}-${{ steps.meta.outputs.cuda_version }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
